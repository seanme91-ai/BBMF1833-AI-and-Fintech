:root{--navy:#14284b;--blue:#2563eb;--green:#16a34a;--red:#dc2626;--bg:#f3f5f9;--muted:#64748b}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;font-family:Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:#0f172a}
.hidden{display:none!important}
header{position:sticky;top:0;z-index:5;background:var(--navy);color:#fff;padding:10px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header h1{font-size:18px;margin:0;flex:1}
.pill{background:rgba(255,255,255,.15);padding:5px 12px;border-radius:20px;font-size:14px}
.hbtn{border:none;border-radius:8px;padding:6px 12px;font-size:13px;cursor:pointer;background:#fff;color:var(--navy);font-weight:600}
.wrap{display:grid;grid-template-columns:250px 1fr;gap:20px;padding:20px;max-width:1500px;margin:auto}
.side{background:#fff;border-radius:14px;padding:14px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.06);align-self:start;position:sticky;top:70px}
#qr{display:flex;justify-content:center;margin:8px 0;cursor:zoom-in}
.side small{color:var(--muted);word-break:break-all;display:block;font-size:11px}
.nav-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-top:12px}
.nav-grid a{border:1px solid #cbd5e1;border-radius:6px;padding:4px 0;font-size:13px;text-decoration:none;color:#0f172a}
.nav-grid a.done{background:#dcfce7;border-color:#86efac}
.warn{background:#fef3c7;color:#92400e;padding:8px;border-radius:8px;font-size:12px;margin-top:8px}
.sec{color:var(--blue);font-weight:700;font-size:15px;text-transform:uppercase;letter-spacing:.5px;margin:26px 4px 8px}
.sec:first-child{margin-top:0}
.card{background:#fff;border-radius:14px;padding:22px 26px;box-shadow:0 2px 8px rgba(0,0,0,.06);margin-bottom:16px;scroll-margin-top:80px}
.qhead{display:flex;justify-content:space-between;color:var(--muted);font-size:14px;font-weight:600}
.qtext{font-size:20px;line-height:1.45;margin:10px 0 16px}
.qtext ul{margin:6px 0}
table.cf{border-collapse:collapse;margin:10px 0;font-size:16px}
table.cf td,table.cf th{border:1px solid #cbd5e1;padding:5px 10px;text-align:right}
table.cf td:first-child,table.cf th:first-child{text-align:left}
.opt{position:relative;display:block;width:100%;text-align:left;border:2px solid #e2e8f0;background:#fff;border-radius:12px;margin-bottom:10px;overflow:hidden;font-size:17px;padding:0;font-family:inherit;color:inherit}
.opt .bar{position:absolute;inset:0 auto 0 0;background:#dbeafe;width:0;transition:width .5s}
.opt .row{position:relative;display:flex;align-items:center;gap:12px;padding:12px 16px}
.opt .let{font-weight:700;width:30px;height:30px;border-radius:50%;background:#e2e8f0;display:flex;align-items:center;justify-content:center;flex-shrink:0}
#host .opt .let{background:var(--navy);color:#fff}
.opt .txt{flex:1}.opt .cnt{font-weight:700;min-width:95px;text-align:right}
.opt.correct{border-color:var(--green)}.opt.correct .bar{background:#bbf7d0}.opt.correct .let{background:var(--green)!important;color:#fff}
.opt.wrong{opacity:.55}
.opt.sel{border-color:var(--blue);background:#eff6ff}.opt.sel .let{background:var(--blue);color:#fff}
.opt.wrongsel{border-color:var(--red);background:#fef2f2;opacity:1}
button.opt{cursor:pointer}button.opt:disabled{cursor:default}
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:6px}
.btn{border:none;border-radius:9px;padding:9px 16px;font-size:14px;cursor:pointer;font-weight:600}
.b2{background:#e2e8f0}.b3{background:var(--green);color:#fff}.b4{background:#fee2e2;color:var(--red)}
.stat{margin-left:auto;color:var(--muted);font-size:15px}
.sol{margin-top:14px;background:#f0fdf4;border-left:5px solid var(--green);padding:14px 18px;border-radius:8px;font-size:16px;line-height:1.55}
.sol h3{margin:0 0 6px;color:var(--green);font-size:17px}
.sol table.cf{background:#fff}
.smsg{color:var(--muted);font-size:14px;margin-top:4px}
#bigqr{position:fixed;inset:0;background:rgba(15,23,42,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9;color:#fff;cursor:zoom-out}
#bigqr div{background:#fff;padding:20px;border-radius:16px}
#student .list{max-width:640px;margin:auto;padding:14px}
#student .card{padding:18px}
#student .qtext{font-size:16px}#student .opt{font-size:15px}
#student table.cf{font-size:12px}#student table.cf td,#student table.cf th{padding:3px 5px}
#student .sol{font-size:14px;overflow-x:auto}
@media(max-width:900px){.wrap{grid-template-columns:1fr}.side{position:static}}

const KEY="bbmf1833ch4";
const L=["A","B","C"], N=DATA.length;
const joinId=new URLSearchParams(location.search).get("join");
const $=id=>document.getElementById(id);
function buildCards(container,isHost){
  let last="";
  DATA.forEach((d,i)=>{
    if(d.lm!==last){last=d.lm;const s=document.createElement("div");s.className="sec";s.textContent=d.lm;container.appendChild(s)}
    const c=document.createElement("div");c.className="card";c.id=(isHost?"h":"s")+"q"+i;
    const tag=isHost?"div":"button";
    c.innerHTML=`<div class="qhead"><span>Question ${i+1} of ${N}</span><span class="badge"></span></div>
      <div class="qtext">${d.q}</div>
      ${d.o.map((t,k)=>`<${tag} ${isHost?"":'type="button"'} class="opt" data-k="${k}"><div class="bar"></div><div class="row"><span class="let">${L[k]}</span><span class="txt">${t}</span><span class="cnt"></span></div></${tag}>`).join("")}
      ${isHost?`<div class="controls">
        <button class="btn b3 rev" type="button">✅ Show answer & solution</button>
        <button class="btn b2 lock" type="button">🔒 Lock voting</button>
        <button class="btn b4 rst" type="button">Reset</button>
        <span class="stat"><b class="ans">0</b> answered</span></div>`:`<div class="smsg"></div>`}
      <div class="sol hidden"><h3></h3><div class="soltext"></div></div>`;
    container.appendChild(c);
  });
}
function startHost(){
  $("host").classList.remove("hidden");
  const blank=()=>({votes:DATA.map(()=>({})),revealed:DATA.map(()=>false),locked:DATA.map(()=>false)});
  let st=JSON.parse(localStorage.getItem(KEY+"_state")||"null")||blank();
  let showCounts=true;const conns=new Map();
  const save=()=>localStorage.setItem(KEY+"_state",JSON.stringify(st));
  buildCards($("hList"),true);
  DATA.forEach((_,i)=>{const a=document.createElement("a");a.href="#hq"+i;a.textContent=i+1;$("navGrid").appendChild(a)});
  function renderQ(i){
    const card=$("hq"+i),d=DATA[i],c=[0,0,0];
    Object.values(st.votes[i]).forEach(v=>{const k=L.indexOf(v);if(k>=0)c[k]++});
    const tot=c[0]+c[1]+c[2],rev=st.revealed[i];
    card.querySelectorAll(".opt").forEach((o,k)=>{
      const pct=tot?Math.round(c[k]/tot*100):0;
      o.className="opt"+(rev?(L[k]===d.ans?" correct":" wrong"):"");
      o.querySelector(".bar").style.width=(showCounts?pct:0)+"%";
      o.querySelector(".cnt").textContent=showCounts?`${c[k]} · ${pct}%`:"";
    });
    card.querySelector(".ans").textContent=tot;
    card.querySelector(".rev").textContent=rev?"🙈 Hide answer":"✅ Show answer & solution";
    card.querySelector(".lock").textContent=st.locked[i]?"🔓 Unlock voting":"🔒 Lock voting";
    card.querySelector(".badge").textContent=rev?"Answer revealed":st.locked[i]?"Voting locked":"Voting open";
    const sol=card.querySelector(".sol");sol.classList.toggle("hidden",!rev);
    sol.querySelector("h3").textContent="Answer: "+d.ans;sol.querySelector(".soltext").innerHTML=d.sol;
    $("navGrid").children[i].classList.toggle("done",rev);
  }
  const updJoined=()=>$("hJoined").textContent=new Set([...conns.values()].map(x=>x.sid).filter(Boolean)).size;
  const renderAll=()=>{for(let i=0;i<N;i++)renderQ(i);updJoined()};
  const payload=sid=>({type:"state",revealed:st.revealed,locked:st.locked,
      ans:DATA.map((d,i)=>st.revealed[i]?d.ans:null),sol:DATA.map((d,i)=>st.revealed[i]?d.sol:null),
      mine:st.votes.map(v=>v[sid]||null)});
  const broadcast=()=>conns.forEach(x=>{if(x.conn.open&&x.sid)x.conn.send(payload(x.sid))});
  const commit=i=>{save();i==null?renderAll():renderQ(i);broadcast()};
  DATA.forEach((_,i)=>{const card=$("hq"+i);
    card.querySelector(".rev").onclick=()=>{st.revealed[i]=!st.revealed[i];commit(i)};
    card.querySelector(".lock").onclick=()=>{st.locked[i]=!st.locked[i];commit(i)};
    card.querySelector(".rst").onclick=()=>{if(confirm(`Clear votes for Q${i+1}?`)){st.votes[i]={};st.revealed[i]=false;st.locked[i]=false;commit(i)}};
  });
  $("bCounts").onclick=()=>{showCounts=!showCounts;$("bCounts").textContent=showCounts?"Hide counts":"Show counts";renderAll()};
  $("bResetAll").onclick=()=>{if(confirm("Clear ALL votes and reveals?")){st=blank();commit(null)}};
  let hostId=localStorage.getItem(KEY+"_hostId");
  if(!hostId){hostId=KEY+"-"+Math.random().toString(36).slice(2,10);localStorage.setItem(KEY+"_hostId",hostId)}
  if(location.protocol==="file:")$("fileWarn").classList.remove("hidden");
  const url=location.origin+location.pathname+"?join="+hostId;
  $("joinUrl").textContent=url;
  new QRCode($("qr"),{text:url,width:210,height:210,correctLevel:QRCode.CorrectLevel.M});
  new QRCode($("qrBig"),{text:url,width:520,height:520,correctLevel:QRCode.CorrectLevel.M});
  $("qr").onclick=()=>$("bigqr").classList.remove("hidden");
  $("bigqr").onclick=()=>$("bigqr").classList.add("hidden");
  const peer=new Peer(hostId);
  peer.on("open",()=>$("hStatus").textContent="🟢 Live");
  peer.on("disconnected",()=>{$("hStatus").textContent="🟡 Reconnecting…";setTimeout(()=>peer.reconnect(),1500)});
  peer.on("error",e=>$("hStatus").textContent=e.type==="unavailable-id"?"⚠ Open in another tab":"⚠ "+e.type);
  peer.on("connection",conn=>{
    conns.set(conn.peer,{conn,sid:null});
    conn.on("data",m=>{const rec=conns.get(conn.peer);if(!rec)return;
      if(m.type==="hello"){rec.sid=m.sid;conn.send(payload(m.sid));updJoined()}
      if(m.type==="vote"){const i=m.idx;
        if(!(i>=0&&i<N)||st.locked[i]||st.revealed[i]||!L.includes(m.choice))return;
        st.votes[i][m.sid]=m.choice;save();renderQ(i);conn.send(payload(m.sid));}
    });
    const drop=()=>{conns.delete(conn.peer);updJoined()};
    conn.on("close",drop);conn.on("error",drop);
  });
  renderAll();
}
function startStudent(){
  $("student").classList.remove("hidden");
  let sid=localStorage.getItem(KEY+"_sid");
  if(!sid){sid="s"+Math.random().toString(36).slice(2,12);localStorage.setItem(KEY+"_sid",sid)}
  buildCards($("sList"),false);
  let conn=null,st={revealed:DATA.map(()=>false),locked:DATA.map(()=>false),ans:[],sol:[],mine:DATA.map(()=>null)};
  DATA.forEach((_,i)=>$("sq"+i).querySelectorAll(".opt").forEach(b=>b.addEventListener("click",()=>{
    const ch=L[+b.dataset.k];
    if(!conn||!conn.open){alert("Not connected yet — please wait a moment.");return}
    if(st.locked[i]||st.revealed[i])return;
    conn.send({type:"vote",sid,idx:i,choice:ch});st.mine[i]=ch;renderQ(i);prog();
  })));
  function renderQ(i){
    const card=$("sq"+i),rev=st.revealed[i],lock=st.locked[i]||rev,mine=st.mine[i],ans=st.ans[i];
    card.querySelectorAll(".opt").forEach((b,k)=>{const l=L[k];let c="opt";
      if(rev){if(l===ans)c+=" correct";else if(l===mine)c+=" wrongsel";else c+=" wrong"}
      else if(l===mine)c+=" sel";
      b.className=c;b.disabled=lock;});
    card.querySelector(".badge").textContent=rev?"Answer revealed":lock?"Locked":mine?"✔ Answered":"";
    card.querySelector(".smsg").textContent=rev?(mine?(mine===ans?"🎉 Correct!":"❌ Not quite — see the solution."):"You didn't answer this one."):
      lock?(mine?`Voting closed. Your answer: ${mine}`:"Voting closed."):mine?`Your answer: ${mine} (tap another to change)`:"";
    const sol=card.querySelector(".sol");sol.classList.toggle("hidden",!rev);
    if(rev){sol.querySelector("h3").textContent="Answer: "+ans;sol.querySelector(".soltext").innerHTML=st.sol[i]}
  }
  const prog=()=>$("sProg").textContent=`${st.mine.filter(Boolean).length} / ${N} answered`;
  const renderAll=()=>{for(let i=0;i<N;i++)renderQ(i);prog()};
  renderAll();
  const peer=new Peer();
  function connect(){
    $("sStatus").textContent="Connecting…";
    conn=peer.connect(joinId,{reliable:true});
    conn.on("open",()=>{$("sStatus").textContent="🟢 Connected";conn.send({type:"hello",sid})});
    conn.on("data",m=>{if(m.type==="state"){st=m;renderAll()}});
    conn.on("close",()=>{$("sStatus").textContent="🔴 Reconnecting…";setTimeout(connect,2500)});
  }
  peer.on("open",connect);
  peer.on("disconnected",()=>setTimeout(()=>peer.reconnect(),1500));
  peer.on("error",e=>{if(e.type==="peer-unavailable"){$("sStatus").textContent="Waiting for host…";setTimeout(connect,3000)}else $("sStatus").textContent="⚠ "+e.type});
}
joinId?startStudent():startHost();
</script>
